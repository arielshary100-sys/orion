<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מגע אוויר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen tablet shell; one view at a time; floating air-cursor above everything */
:root{
  --bg:#0d1117; --panel:#161c26; --panel2:#1f2733; --fg:#eef2f7; --muted:#8b98ab;
  --accent:#4cc9f0; --pinch:#ff5d8f; --ok:#5be39b;
  --font:"Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;user-select:none}
button{font-family:inherit;color:inherit}
.view{position:absolute;inset:0;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none!important}
.topbar{display:flex;align-items:center;gap:12px;min-height:56px}
.topbar h1{font-size:22px;margin:0;font-weight:700;flex:1}
.back{background:var(--panel2);border:0;border-radius:14px;padding:14px 22px;font-size:18px;cursor:pointer}
.clock{font-size:clamp(48px,9vw,96px);font-weight:800;letter-spacing:-.02em;text-align:center;margin-top:4vh;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--muted);font-size:18px;margin-top:-8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:22px;max-width:820px;width:100%;margin:5vh auto 0}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;padding:8px;border-radius:24px;transition:transform .15s}
.icon{width:min(120px,26vw);aspect-ratio:1;border-radius:28%;display:grid;place-items:center;font-size:44px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.app span{font-size:17px;font-weight:500}
.hot{transform:scale(1.08)}
.hot .icon,.hot.key,.hot.back,.hot.btn{outline:4px solid var(--accent);outline-offset:3px}
.hint{text-align:center;color:var(--muted);font-size:15px;margin-top:auto;line-height:1.6}
.hint b{color:var(--fg)}

/* search */
.searchbox{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
.field{flex:1;background:var(--panel);border-radius:999px;padding:18px 26px;font-size:22px;min-height:64px;direction:ltr;text-align:left;overflow:hidden;white-space:nowrap}
.field:empty::before{content:"Search…";color:var(--muted)}
.btn{background:var(--accent);color:#04121a;border:0;border-radius:999px;padding:0 28px;font-size:19px;font-weight:700;cursor:pointer;min-height:64px}
.kb{display:flex;flex-direction:column;gap:10px;max-width:900px;width:100%;margin:10px auto 0;direction:ltr}
.row{display:flex;gap:8px;justify-content:center}
.key{flex:1;max-width:76px;min-height:64px;background:var(--panel2);border:0;border-radius:14px;font-size:22px;cursor:pointer}
.key.wide{max-width:none;flex:3}
.key.mid{max-width:120px;flex:1.6;font-size:17px}
.recent{max-width:820px;width:100%;margin:0 auto;color:var(--muted);font-size:15px;direction:ltr;text-align:left}
.recent a{color:var(--accent)}

/* shorts */
#shorts{padding:0;background:#000}
.feed{position:absolute;inset:0;overflow:hidden}
.track{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.clip{position:absolute;left:0;right:0;height:100%;display:grid;place-items:center}
.clip .card{width:min(56vh,92vw);height:92%;border-radius:22px;overflow:hidden;position:relative;background:#111}
.clip iframe{width:100%;height:100%;border:0}
.demo{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;font-size:26px;font-weight:700}
.demo small{display:block;font-size:15px;font-weight:400;opacity:.85;margin-top:6px}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75;animation:float 6s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(40px,-60px) scale(1.25)}}
.shorts-ui{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));left:max(16px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;z-index:3}
.counter{margin-inline-start:auto;background:rgba(0,0,0,.55);padding:10px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.swipe-flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:90px;opacity:0;pointer-events:none;z-index:4;transition:opacity .2s}
.addlink{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3;width:min(560px,92vw)}
.addlink input{flex:1;min-width:0;border-radius:999px;border:0;padding:12px 16px;font-size:15px;background:rgba(255,255,255,.12);color:var(--fg);direction:ltr}
.addlink button{border:0;border-radius:999px;padding:0 18px;background:rgba(255,255,255,.18);cursor:pointer;font-size:15px}

/* paint */
#paintCanvas{flex:1;background:var(--panel);border-radius:20px;width:100%;min-height:0;touch-action:none}
.swatches{display:flex;gap:10px}
.sw{width:52px;height:52px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--fg)}

/* camera + cursor */
#cam{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));width:180px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;z-index:50;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#status{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;background:var(--panel2);padding:10px 18px;border-radius:999px;font-size:15px;max-width:92vw;text-align:center}
#cursor{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid var(--accent);background:rgba(76,201,240,.18);z-index:100;pointer-events:none;transition:width .1s,height .1s,margin .1s,border-color .1s;display:none}
#cursor.pinch{width:28px;height:28px;margin:-14px 0 0 -14px;border-color:var(--pinch);background:rgba(255,93,143,.45)}
#start{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#start h2{font-size:clamp(30px,6vw,52px);margin:0;font-weight:800}
#start p{color:var(--muted);max-width:520px;line-height:1.7;margin:0;font-size:17px}
#start .btn{padding:0 40px;font-size:21px}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:16px}
@media (prefers-reduced-motion:reduce){.track{transition:none}.blob{animation:none}}
</style>
</head>
<body>

<div id="start">
  <h2>מגע אוויר ✋</h2>
  <p>מזיזים את <b>האצבע המורה</b> מול המצלמה כדי להזיז את הסמן.<br>
  <b>צביטה</b> (אגודל + אצבע מורה) = נגיעה.<br>
  בשורטס: <b>מזיזים את היד מהר למעלה</b> לסרטון הבא, <b>למטה</b> לקודם.</p>
  <button class="btn" id="go">הפעל מצלמה</button>
  <button class="ghost" id="nocam">נסה בלי מצלמה (עכבר)</button>
</div>

<div id="status" hidden></div>
<div id="cam" hidden><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
<div id="cursor"></div>

<!-- HOME -->
<section class="view" id="home">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="grid">
    <button class="app" data-tap data-open="search"><div class="icon" style="background:#fff;color:#4285f4">G</div><span>Google</span></button>
    <button class="app" data-tap data-open="shorts"><div class="icon" style="background:#ff0033;color:#fff">▶</div><span>YouTube Shorts</span></button>
    <button class="app" data-tap data-open="paint"><div class="icon" style="background:linear-gradient(135deg,#ffb703,#fb5607);color:#fff">✎</div><span>ציור באוויר</span></button>
    <button class="app" data-tap data-open="ytsite"><div class="icon" style="background:#282828;color:#ff0033">▶</div><span>YouTube (אתר)</span></button>
  </div>
  <p class="hint">הצבע עם האצבע המורה · <b>צבוט</b> כדי לפתוח אפליקציה</p>
</section>

<!-- SEARCH -->
<section class="view" id="search" hidden>
  <div class="topbar"><button class="back" data-tap data-back>→ חזרה</button><h1>חיפוש Google</h1></div>
  <div class="searchbox"><div class="field" id="query"></div><button class="btn" data-tap id="doSearch">חפש</button></div>
  <div class="kb" id="kb"></div>
  <div class="recent" id="recent"></div>
</section>

<!-- SHORTS -->
<section class="view" id="shorts" hidden>
  <div class="feed"><div class="track" id="track"></div></div>
  <div class="shorts-ui"><button class="back" data-tap data-back>→ חזרה</button><span class="counter" id="counter">1 / 1</span></div>
  <div class="swipe-flash" id="flash">⬆</div>
  <div class="addlink"><input id="linkIn" placeholder="הדבק קישור ל-YouTube Shorts"><button id="addBtn">הוסף</button></div>
</section>

<!-- PAINT -->
<section class="view" id="paint" hidden>
  <div class="topbar"><button class="back" data-tap data-back>→ חזרה</button><h1>ציור באוויר</h1>
    <div class="swatches" id="swatches"></div>
    <button class="back" data-tap id="clearPaint">נקה</button></div>
  <canvas id="paintCanvas"></canvas>
  <p class="hint" style="margin:0">החזק צביטה כדי לצייר</p>
</section>

<script type="module">
// ---------- state ----------
const $ = s => document.querySelector(s);
const views = ["home","search","shorts","paint"];
let current = "home";
const cursorEl = $("#cursor");
let cx = innerWidth/2, cy = innerHeight/2;      // smoothed cursor
let pinching = false, hotEl = null;
const status = msg => { const s=$("#status"); s.textContent=msg; s.hidden=!msg; };

function show(name){
  if(name==="ytsite"){ window.open("https://www.youtube.com/shorts","_blank"); return; }
  views.forEach(v => $("#"+v).hidden = v!==name);
  current = name;
  if(name==="paint") sizePaint();
  if(name==="shorts") renderFeed();
}
document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => show(b.dataset.open));
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show("home"));

// ---------- clock ----------
function tick(){
  const d=new Date();
  $("#clock").textContent=d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  $("#date").textContent=d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,10000);

// ---------- keyboard / search ----------
const layouts = {
  en:["qwertyuiop","asdfghjkl","zxcvbnm"],
  he:["פםןוטארק","ףךלחיעכגדש","ץתצמנהבסז"]
};
let lang="en", query="";
function buildKb(){
  const kb=$("#kb"); kb.innerHTML="";
  layouts[lang].forEach(r=>{
    const row=document.createElement("div"); row.className="row";
    [...r].forEach(ch=>{ const k=document.createElement("button"); k.className="key"; k.dataset.tap=""; k.textContent=ch; k.onclick=()=>{query+=ch;upd()}; row.appendChild(k); });
    kb.appendChild(row);
  });
  const row=document.createElement("div"); row.className="row";
  const mk=(t,cls,fn)=>{const k=document.createElement("button");k.className="key "+cls;k.dataset.tap="";k.textContent=t;k.onclick=fn;row.appendChild(k)};
  mk(lang==="en"?"עב":"EN","mid",()=>{lang=lang==="en"?"he":"en";buildKb()});
  mk("רווח","wide",()=>{query+=" ";upd()});
  mk("⌫","mid",()=>{query=query.slice(0,-1);upd()});
  mk("נקה","mid",()=>{query="";upd()});
  kb.appendChild(row);
}
function upd(){ $("#query").textContent=query; }
$("#doSearch").onclick=()=>{
  if(!query.trim()) return;
  const url="https://www.google.com/search?q="+encodeURIComponent(query.trim());
  const a=$("#recent"); a.innerHTML=""; const l=document.createElement("a"); l.href=url; l.target="_blank"; l.textContent="תוצאות עבור: "+query; a.append("נפתח בלשונית חדשה · ",l);
  window.open(url,"_blank");
};
buildKb();

// ---------- shorts feed ----------
const demoClips=[
  ["סרטון דמו 1","החלק עם היד למעלה לסרטון הבא","#7209b7","#f72585"],
  ["סרטון דמו 2","היד למטה = הסרטון הקודם","#0077b6","#00f5d4"],
  ["סרטון דמו 3","הדבק קישורי Shorts אמיתיים למטה","#ff6d00","#ffd60a"],
  ["סרטון דמו 4","עובד גם עם חיצי המקלדת","#2d6a4f","#95d5b2"],
];
let ytIds=[];
try{ ytIds=JSON.parse(localStorage.getItem("airtouch-shorts")||"[]") }catch(e){}
let idx=0;
function items(){ return [...ytIds.map(id=>({yt:id})), ...demoClips.map(d=>({demo:d}))]; }
function renderFeed(){
  const list=items(), tr=$("#track"); tr.innerHTML="";
  idx=Math.min(idx,list.length-1);
  list.forEach((it,i)=>{
    const c=document.createElement("div"); c.className="clip"; c.style.top=(i*100)+"%";
    const card=document.createElement("div"); card.className="card";
    if(it.yt){
      if(Math.abs(i-idx)<=1){
        const f=document.createElement("iframe");
        f.allow="autoplay; encrypted-media";
        f.src=`https://www.youtube.com/embed/${it.yt}?autoplay=${i===idx?1:0}&mute=1&loop=1&playlist=${it.yt}&playsinline=1&controls=0`;
        card.appendChild(f);
      }
    } else {
      const [t,s,a,b]=it.demo;
      card.style.background=`linear-gradient(160deg,${a},#0b0b12)`;
      card.innerHTML=`<div class="blob" style="width:60%;height:40%;background:${b};top:15%;left:10%"></div><div class="blob" style="width:45%;height:30%;background:${a};top:45%;right:5%;animation-delay:-3s"></div><div class="demo" style="position:relative">${t}<small>${s}</small></div>`;
    }
    c.appendChild(card); tr.appendChild(c);
  });
  tr.style.transform=`translateY(${-idx*100}%)`;
  $("#counter").textContent=`${idx+1} / ${list.length}`;
}
function go(dir){
  const n=items().length, ni=Math.max(0,Math.min(n-1,idx+dir));
  const f=$("#flash"); f.textContent=dir>0?"⬆":"⬇"; f.style.opacity=1; setTimeout(()=>f.style.opacity=0,350);
  if(ni===idx) return; idx=ni; renderFeed();
}
$("#addBtn").onclick=()=>{
  const v=$("#linkIn").value.trim();
  const m=v.match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/) || v.match(/^([A-Za-z0-9_-]{11})$/);
  if(!m){ $("#linkIn").value=""; $("#linkIn").placeholder="הקישור לא זוהה, נסה שוב"; return; }
  ytIds.unshift(m[1]); try{localStorage.setItem("airtouch-shorts",JSON.stringify(ytIds))}catch(e){}
  $("#linkIn").value=""; idx=0; renderFeed();
};
addEventListener("keydown",e=>{
  if(current!=="shorts"||e.target.tagName==="INPUT") return;
  if(e.key==="ArrowDown") go(1); if(e.key==="ArrowUp") go(-1);
});
addEventListener("wheel",e=>{ if(current==="shorts"){ const now=performance.now(); if(now-lastSwipe>700){ lastSwipe=now; go(e.deltaY>0?1:-1);} } },{passive:true});

// ---------- paint ----------
const pc=$("#paintCanvas"), pctx=pc.getContext("2d");
let color="#4cc9f0", lastPt=null;
["#4cc9f0","#ff5d8f","#ffd60a","#5be39b","#ffffff"].forEach((c,i)=>{
  const s=document.createElement("button"); s.className="sw"+(i?"":" on"); s.dataset.tap=""; s.style.background=c;
  s.onclick=()=>{color=c;document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===s))};
  $("#swatches").appendChild(s);
});
function sizePaint(){ const r=pc.getBoundingClientRect(); if(pc.width!==Math.round(r.width)){ pc.width=r.width; pc.height=r.height; } }
$("#clearPaint").onclick=()=>pctx.clearRect(0,0,pc.width,pc.height);
function paintAt(x,y,down){
  if(current!=="paint"||!down){ lastPt=null; return; }
  const r=pc.getBoundingClientRect(); const p={x:x-r.left,y:y-r.top};
  if(p.x<0||p.y<0||p.x>r.width||p.y>r.height){ lastPt=null; return; }
  pctx.strokeStyle=color; pctx.lineWidth=8; pctx.lineCap="round";
  pctx.beginPath(); pctx.moveTo((lastPt||p).x,(lastPt||p).y); pctx.lineTo(p.x,p.y); pctx.stroke(); lastPt=p;
}
addEventListener("resize",()=>{ if(current==="paint") sizePaint(); });

// ---------- air cursor core ----------
function tapTarget(x,y){
  const el=document.elementFromPoint(x,y);
  return el ? el.closest("[data-tap]") : null;
}
function setHot(el){
  if(hotEl===el) return;
  hotEl?.classList.remove("hot"); hotEl=el; hotEl?.classList.add("hot");
}
function moveCursor(x,y,isPinch){
  cursorEl.style.display="block";
  cursorEl.style.transform=`translate(${x}px,${y}px)`;
  cursorEl.classList.toggle("pinch",isPinch);
  const t=tapTarget(x,y); setHot(t);
  if(isPinch && !pinching){ t?.click(); }       // pinch start = tap
  pinching=isPinch;
  paintAt(x,y,isPinch);
}

// mouse fallback
function enableMouse(){
  addEventListener("mousemove",e=>moveCursor(e.clientX,e.clientY,e.buttons===1));
  addEventListener("mousedown",e=>{ if(e.target.closest("input")) return; moveCursor(e.clientX,e.clientY,true); });
  addEventListener("mouseup",e=>moveCursor(e.clientX,e.clientY,false));
  document.querySelectorAll("[data-tap]").forEach(b=>b.addEventListener("click",e=>{ if(e.isTrusted) e.stopImmediatePropagation(); },true));
}

// ---------- hand tracking ----------
let lastSwipe=0;
const yHist=[];
function onHand(lm){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const size=d(lm[0],lm[9])||0.1;
  const ratio=d(lm[4],lm[8])/size;
  const isPinch = pinching ? ratio<0.55 : ratio<0.33;   // hysteresis
  // map fingertip (mirrored) with margins so screen edges are reachable
  const nx=Math.min(1,Math.max(0,((1-lm[8].x)-0.12)/0.76));
  const ny=Math.min(1,Math.max(0,(lm[8].y-0.1)/0.7));
  const tx=nx*innerWidth, ty=ny*innerHeight;
  const k = isPinch ? 0.25 : 0.45;                      // steadier while pinching
  cx+= (tx-cx)*k; cy+=(ty-cy)*k;

  // swipe detection on the whole hand (wrist), shorts only
  const now=performance.now();
  yHist.push({t:now,y:lm[0].y}); while(yHist.length && now-yHist[0].t>280) yHist.shift();
  if(current==="shorts" && !isPinch && yHist.length>3 && now-lastSwipe>800){
    const dy=yHist[yHist.length-1].y-yHist[0].y;
    if(Math.abs(dy)>0.17){ lastSwipe=now; yHist.length=0; go(dy<0?1:-1); }
  }
  moveCursor(cx,cy,isPinch);
}

async function startCamera(){
  $("#start").hidden=true;
  status("טוען זיהוי ידיים…");
  try{
    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const fileset = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const hl = await vision.HandLandmarker.createFromOptions(fileset,{
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
      runningMode:"VIDEO", numHands:1
    });
    const video=$("#video");
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
    await video.play();
    $("#cam").hidden=false; status("");
    const ov=$("#overlay"), octx=ov.getContext("2d");
    const draw=new vision.DrawingUtils(octx);
    let lastT=-1;
    const loop=()=>{
      if(video.currentTime!==lastT){
        lastT=video.currentTime;
        ov.width=video.videoWidth; ov.height=video.videoHeight;
        const res=hl.detectForVideo(video,performance.now());
        octx.clearRect(0,0,ov.width,ov.height);
        if(res.landmarks?.length){
          const lm=res.landmarks[0];
          draw.drawConnectors(lm,vision.HandLandmarker.HAND_CONNECTIONS,{color:"#4cc9f0",lineWidth:3});
          draw.drawLandmarks(lm,{color:"#ff5d8f",radius:3});
          onHand(lm);
        } else { cursorEl.style.display="none"; setHot(null); pinching=false; lastPt=null; }
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(err){
    console.error(err);
    status(err.name==="NotAllowedError" ? "אין הרשאה למצלמה. אפשר אותה בהגדרות הדפדפן ורענן." :
           !window.isSecureContext ? "המצלמה עובדת רק בכתובת https. ראה הוראות." :
           "לא הצלחתי להפעיל את המצלמה. עובר למצב עכבר.");
    enableMouse();
  }
}
$("#go").onclick=startCamera;
$("#nocam").onclick=()=>{ $("#start").hidden=true; enableMouse(); };
</script>
</body>
</html>
